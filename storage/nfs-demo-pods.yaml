
apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer
  namespace: taskhub
  labels:
    app: taskhub
    component: nfs-demo
    environment: lab

spec:
  nodeSelector:
    kubernetes.io/hostname: taskhub-worker

  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]

      resources:
        requests:
          cpu: "5m"
          memory: "8Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"

      volumeMounts:
        - name: shared-storage
          mountPath: /shared

  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: taskhub-nfs-pvc

---
