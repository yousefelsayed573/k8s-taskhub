
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: taskhub
  labels:
    app: taskhub
    component: storage-demo
    environment: lab

spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 86400

      resources:
        requests:
          cpu: "5m"
          memory: "8Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"

      volumeMounts:
        - name: temporary-data
          mountPath: /workspace

  volumes:
    - name: temporary-data
      emptyDir:
        sizeLimit: 32Mi
