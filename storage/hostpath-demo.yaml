apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: taskhub
  labels:
    app: taskhub
    component: storage-demo
    environment: lab

spec:
  nodeSelector:
    kubernetes.io/hostname: taskhub-worker

  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 86400

      resources:
        requests:
          cpu: "5m"
          memory: "8Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"

      volumeMounts:
        - name: host-data
          mountPath: /node-data

  volumes:
    - name: host-data
      hostPath:
        path: /var/local/taskhub-hostpath-demo
        type: DirectoryOrCreate
