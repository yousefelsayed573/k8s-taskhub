
apiVersion: v1
kind: Service
metadata:
  name: taskhub-db-headless
  namespace: taskhub
  labels:
    app: taskhub
    component: database
    environment: lab

spec:
  clusterIP: None

  selector:
    app: taskhub
    component: database

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
