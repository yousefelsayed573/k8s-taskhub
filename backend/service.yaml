apiVersion: v1
kind: Service
metadata:
  name: taskhub-backend
  namespace: taskhub
  labels:
    app: taskhub
    component: backend
    environment: lab

spec:
  type: ClusterIP

  selector:
    app: taskhub
    component: backend

  ports:
    - name: http
      protocol: TCP
      port: 5678
      targetPort: http
