
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskhub-pod-reader-binding
  namespace: taskhub
  labels:
    app: taskhub
    component: security
    environment: lab

subjects:
  - kind: ServiceAccount
    name: taskhub-pod-reader
    namespace: taskhub

roleRef:
  kind: Role
  name: taskhub-pod-reader-role
  apiGroup: rbac.authorization.k8s.io
