
apiVersion: batch/v1
kind: CronJob
metadata:
  name: taskhub-maintenance
  namespace: taskhub
  labels:
    app: taskhub
    component: maintenance
    environment: lab

spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        metadata:
          labels:
            app: taskhub
            component: maintenance
            environment: lab

        spec:
          restartPolicy: Never

          containers:
            - name: maintenance
              image: busybox:1.36

              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "TaskHub maintenance started"
                  echo "Execution time: $(date -u)"
                  echo "TaskHub maintenance completed"

              resources:
                requests:
                  cpu: "5m"
                  memory: "8Mi"
                limits:
                  cpu: "100m"
                  memory: "32Mi"
