
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: taskhub-node-agent
  namespace: taskhub
  labels:
    app: taskhub
    component: node-agent
    environment: lab

spec:
  selector:
    matchLabels:
      app: taskhub
      component: node-agent

  template:
    metadata:
      labels:
        app: taskhub
        component: node-agent
        environment: lab

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - taskhub-worker
                      - taskhub-worker2

      containers:
        - name: agent
          image: busybox:1.36

          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "TaskHub agent heartbeat on node: $NODE_NAME"
                sleep 30
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
