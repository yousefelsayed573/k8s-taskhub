
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskhub-frontend
  namespace: taskhub
  labels:
    app: taskhub
    component: frontend
    environment: lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskhub
      component: frontend

  template:
    metadata:
      labels:
        app: taskhub
        component: frontend
        environment: lab

    spec:
      containers:
        - name: frontend
          image: nginx:stable-alpine

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: taskhub-config

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
