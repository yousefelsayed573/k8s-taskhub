apiVersion: v1
kind: Service
metadata:
  name: taskhub-frontend
  namespace: taskhub
  labels:
    app: taskhub
    component: frontend
    environment: lab

spec:
  type: ClusterIP

  selector:
    app: taskhub
    component: frontend

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
